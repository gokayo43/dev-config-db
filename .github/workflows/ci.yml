name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # dev-config's gate over this tree, called directly rather than through this
  # repo's own check.yml beside it: a commit cannot pin its own SHA, and the
  # wrapper reaches dev-config by a pin that would be one commit behind whatever
  # is being reviewed. What the wrapper adds to that call — the pass-through — is
  # graded by tests/wrapper-inputs.test.ts, which the suite lane below runs.
  check:
    uses: gokayo43/dev-config/.github/workflows/check.yml@f31fe8292d666b745a8b807ce0301d5ba64c9b35 # v0.55.2
    with:
      # The contract wants the .env.example/.gitignore shape of a repo that has
      # an environment to document. This one has none to document: what it ships
      # reads variables the CALLING job sets — DATABASE_URL, and the INPUT_* an
      # action.yml maps in — and there is no value here for a developer to copy
      # into a file of their own.
      contract-exemptions: secrets
      # Read in review like the reason on a lint directive, and it is about this
      # suite rather than about the gate: the database gates' cases each drive a
      # real server — one container per product this repo certifies — which the
      # suite starts and reaches on the runner's loopback. The sealed lane puts
      # the run in a network namespace with a loopback of its own, which no
      # published port is on.
      test-network: the database gates' suites drive server containers on the runner's loopback

  # The one thing `bun test` cannot run: the shipped k6 ramp, under the k6 this
  # repo pins. A bun test cannot fetch a binary — the suite's lane has no
  # business doing so — and "it runs inside k6" is why the linter and knip skip
  # that file, which is not a reason for nothing to have executed it.
  ramp-script:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, and it runs this repo's own scripts in the same
          # workspace the token would sit in.
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: The shipped ramp, under the k6 the ramp step pins
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          . .github/actions/db-serving/k6.sh
          bun tests/ramp-script.ts
