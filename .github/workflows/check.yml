name: Check

# The gate the two MySQL-family repos run, called by reference:
#   jobs.check.uses: gokayo43/dev-config-db/.github/workflows/check.yml@<sha>
#
# Everything static is dev-config's, unchanged: this workflow calls that one
# rather than restating any of it, so a gate lands here when the pin below moves
# and never because a copy drifted. `database: external` is the value their
# check.yml has for exactly this arrangement — their database job is Postgres,
# and a workflow wrapping theirs runs the database gates in its place — so the
# input is handed on rather than answered here, and the job below is what a
# consumer gets instead.
on:
  workflow_call:
    inputs:
      # No descriptions on a pass-through, deliberately. dev-config declares
      # every one of these and says what it does, including the conditions under
      # which it refuses one; a second copy of that prose is a copy that drifts,
      # and `description` is optional on a workflow_call input. The ones that
      # carry one say what dev-config cannot: a fact about calling this workflow
      # instead of that one, or a fact about a job of this repo's own.
      build:
        type: boolean
        default: false
      affected:
        type: boolean
        default: false
      compose:
        type: boolean
        default: false
      mutation-lane:
        type: boolean
        default: false
      mutation-floor:
        type: string
        default: ""
      contract-exemptions:
        description: >-
          A consumer of this workflow names `ci-call` among these: dev-config's
          repo contract asks for a job calling its own check.yml at a pinned SHA,
          and a consumer's call into it is one level down, where that gate cannot
          read it.
        type: string
        default: ""
      stack-allowlist:
        type: string
        default: ""
      data-jobs-external:
        type: string
        default: ""
      test-network:
        type: string
        default: ""
      test-suite-evidence:
        type: string
        default: ""
      database:
        description: >-
          `external` runs this workflow's own database job — the repo's
          migrations replayed onto an empty database on the server it pinned,
          the upgrade path where it asks for one, the DATETIME catalogue, and
          the app booted, probed and ramped against the result. It is
          dev-config's own spelling and its own value for exactly this: a
          workflow wrapping theirs runs the database gates in that job's place.
          `none` is a repo with no schema. `postgres` is refused here rather
          than served — a Postgres repo calls dev-config directly.
        type: string
        default: none
      database-image:
        description: >-
          The server that job runs, as an image pinned by digest — a MariaDB or
          a MySQL 8 one, which are the two products these gates are certified
          against. It is the consumer's own declaration and their own pin
          discipline: nothing here infers a product from it, and the gates ask
          the image what it ships rather than the reference what it is called.
          The default is the MariaDB build this repo certifies, so a consumer
          who runs that writes nothing.
        type: string
        default: mariadb:11.4@sha256:4f1d8d202fcf7bcb3902f63af09f9c1a050c2922a89652f22abaec0d4f015e83
      upgrade-gate:
        description: >-
          Also prove that a database built from the base ref's migrations and
          upgraded by this branch's reaches the schema a fresh one gets — for
          repos whose database is deployed somewhere. dev-config's check.yml
          stopped asking this of a caller passing `database: external`, on the
          argument that a workflow replacing the database gates carries the
          upgrade duty for its own dialects; this input is that duty for
          MariaDB and MySQL 8. docs/gates/db-upgrade.md is what it proves.
        type: boolean
        default: false
      db-gate-evidence:
        type: string
        default: ""
      start-command:
        type: string
        default: bun run start
      health-url:
        type: string
        default: http://localhost:3000/api/health
      probe-command:
        type: string
        default: ""
      probe-timeout:
        type: string
        default: ""
      capacity-script:
        type: string
        default: ""
      capacity-path:
        type: string
        default: ""
      route-allowlist:
        type: string
        default: ""
      datetime-allowlist:
        description: >-
          The columns of the migrated database whose value really is a
          wall-clock reading rather than an instant, as `table.column -- why`
          entries, one per line. An input of this repo's own, and the one
          dev-config has no name for at all — docs/gates/db-datetime.md is what
          it waives and why it is spelled this way.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  static:
    uses: gokayo43/dev-config/.github/workflows/check.yml@f31fe8292d666b745a8b807ce0301d5ba64c9b35 # v0.55.2
    with:
      build: ${{ inputs.build }}
      affected: ${{ inputs.affected }}
      compose: ${{ inputs.compose }}
      mutation-lane: ${{ inputs['mutation-lane'] }}
      mutation-floor: ${{ inputs['mutation-floor'] }}
      contract-exemptions: ${{ inputs['contract-exemptions'] }}
      stack-allowlist: ${{ inputs['stack-allowlist'] }}
      data-jobs-external: ${{ inputs['data-jobs-external'] }}
      test-network: ${{ inputs['test-network'] }}
      test-suite-evidence: ${{ inputs['test-suite-evidence'] }}
      # Handed on rather than answered here, which it was not always: while
      # dev-config's `database` was a boolean meaning "run our Postgres job",
      # this workflow had to answer it with a literal `false` and keep an input
      # of the same name for its own job — one spelling, two questions. Their
      # enum has a value that means "a workflow wrapping this one runs them",
      # so the two questions became one and the literal died with them.
      database: ${{ inputs.database }}

  # Every input aimed at the database job is a request that job would otherwise
  # never see, and a gate nobody notices is off is the worst kind — so a call
  # that asks for one without asking for the job is refused rather than ignored.
  #
  # A job rather than a step, because the only other job that always runs here
  # is a `uses:` and a called workflow takes no steps of a caller's. It has no
  # `if:` for the reason dev-config's own guard has none: a condition restating
  # what the body tests is a second statement of one rule, and the half that
  # gets forgotten is the guard. The body is the rule.
  refusals:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          DATABASE: ${{ inputs.database }}
          DATABASE_IMAGE: ${{ inputs['database-image'] }}
          UPGRADE_GATE: ${{ inputs['upgrade-gate'] }}
          DB_GATE_EVIDENCE: ${{ inputs['db-gate-evidence'] }}
          START_COMMAND: ${{ inputs['start-command'] }}
          HEALTH_URL: ${{ inputs['health-url'] }}
          PROBE_COMMAND: ${{ inputs['probe-command'] }}
          PROBE_TIMEOUT: ${{ inputs['probe-timeout'] }}
          CAPACITY_SCRIPT: ${{ inputs['capacity-script'] }}
          CAPACITY_PATH: ${{ inputs['capacity-path'] }}
          ROUTE_ALLOWLIST: ${{ inputs['route-allowlist'] }}
          # The three defaults above, written out a second time because a step
          # cannot read an input's declared default. tests/refusals.test.ts
          # holds the pairs together; `changed_from_default` below is why they
          # are compared at all.
          # A boolean has no empty spelling either, so it is compared with its
          # declared default like the two below rather than tested for being
          # non-empty. Quoted, because what a step reads is always a string.
          UPGRADE_GATE_DEFAULT: "false"
          START_COMMAND_DEFAULT: bun run start
          HEALTH_URL_DEFAULT: http://localhost:3000/api/health
          DATABASE_IMAGE_DEFAULT: mariadb:11.4@sha256:4f1d8d202fcf7bcb3902f63af09f9c1a050c2922a89652f22abaec0d4f015e83
          DATETIME_ALLOWLIST: ${{ inputs['datetime-allowlist'] }}
        shell: bash
        run: |
          set -euo pipefail
          wrong=0
          refuse() {
            echo "::error::$1"
            wrong=1
          }

          # `external` is the value that asks for the database job, so it is
          # what every rule below compares against — the input is dev-config's
          # enum rather than a boolean of this workflow's own.
          #
          # The rule has two shapes and this is the first: an input that
          # defaults to "" was passed iff it is non-empty.
          #
          # Both helpers end in `return 0`, and that is not decoration — under
          # `set -e` a function whose last statement is a test that failed
          # returns non-zero, and the step would die on a rule that correctly
          # did not fire.
          needs_job() {
            if [ "$DATABASE" != external ] && [ -n "$2" ]; then
              refuse "$1 needs database: external — $3, and this call leaves that job off"
            fi
            return 0
          }

          # The second shape, for the three inputs that carry a value rather
          # than an empty default: a workflow_call input cannot be asked whether
          # the caller passed it, so "passed" is spelled "differs from the
          # default". That leaves one caller invisible — the one who passes
          # exactly the default — which docs/gates/db-serving.md names rather
          # than papers over, and dev-config#66 is two of the three going
          # unrefused there, where the guard has only the first shape.
          changed_from_default() {
            if [ "$DATABASE" != external ] && [ "$2" != "$3" ]; then
              refuse "$1 needs database: external — $4, and this call leaves that job off"
            fi
            return 0
          }

          needs_job db-gate-evidence "$DB_GATE_EVIDENCE" \
            "it names the artifact the database job uploads"
          needs_job probe-command "$PROBE_COMMAND" \
            "the probe runs against the app the database job boots"
          needs_job probe-timeout "$PROBE_TIMEOUT" \
            "it bounds a probe the database job runs"
          needs_job capacity-script "$CAPACITY_SCRIPT" \
            "the ramp runs against the app the database job boots"
          needs_job capacity-path "$CAPACITY_PATH" \
            "the ramp runs against the app the database job boots"
          needs_job route-allowlist "$ROUTE_ALLOWLIST" \
            "the route floor is measured across the database job's ramp"
          needs_job datetime-allowlist "$DATETIME_ALLOWLIST" \
            "it waives columns the database job's DATETIME step grades"
          changed_from_default upgrade-gate "$UPGRADE_GATE" "$UPGRADE_GATE_DEFAULT" \
            "it adds a step to the database job, which replays the base ref's migrations"
          changed_from_default database-image "$DATABASE_IMAGE" "$DATABASE_IMAGE_DEFAULT" \
            "it is the server the database job starts, and this call starts none"
          changed_from_default start-command "$START_COMMAND" "$START_COMMAND_DEFAULT" \
            "it is how the database job's boot step starts the app"
          changed_from_default health-url "$HEALTH_URL" "$HEALTH_URL_DEFAULT" \
            "it is what the database job's boot step polls and what its ramp measures"

          # The one value of dev-config's enum this workflow does not serve. A
          # repo whose database is Postgres wants their check.yml rather than
          # this one, and passing it here would hand their Postgres job a repo
          # that called this workflow for its MySQL-family gates.
          if [ "$DATABASE" = postgres ]; then
            refuse "database: postgres is not a value this workflow serves — its database job is MariaDB and MySQL 8. A repo whose database is Postgres calls gokayo43/dev-config's check.yml directly."
          fi

          # Asked whatever the job, because it is a fact about the pair rather
          # than about the job: a bound with no command under it bounds nothing,
          # and an input that reaches a step which never reads it is the class
          # every refusal here exists to kill.
          if [ -z "$PROBE_COMMAND" ] && [ -n "$PROBE_TIMEOUT" ]; then
            refuse "probe-timeout needs probe-command — it bounds that command, and on its own it bounds nothing"
          fi
          exit "$wrong"

  database:
    if: inputs.database == 'external'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The database server is NOT here, and that is the one thing about this job
    # worth knowing before reading it. A service image is a literal in this
    # file, and the server is the consumer's to pin — `services.<id>.image`
    # holding `${{ inputs[…] }}` is read by dev-config's own pin gate as a
    # mutable tag and refused (gokayo43/dev-config#68). So the server is started
    # by a step instead, from the image the caller declared: db-server, first in
    # the job, publishing on the loopback port DATABASE_URL below names, which
    # is what a service container would have done.
    #
    # Redis stays a service and is started unconditionally: it is this
    # workflow's own pin rather than a consumer's, and a repo whose migrator
    # imports its own environment module gets that module's Redis check on the
    # way in, for the couple of seconds an idle container costs.
    services:
      redis:
        image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30

    # 127.0.0.1 rather than localhost: a MySQL-family client reads that name as
    # an instruction to use a unix socket, and the server is a container.
    env:
      DATABASE_URL: mysql://root:db-gate@127.0.0.1:3306/app
      REDIS_URL: redis://127.0.0.1:6379

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The upgrade gate replays the base ref's migrations, which are in the
          # history — and this job cannot fetch them later, because it holds no
          # credentials and every repo here is private. Unconditional rather
          # than keyed to the input, which is dev-config's own reasoning for the
          # same line: an expression that has to produce 0 rides on how GitHub
          # casts it, and the failure mode of getting that wrong is a gate that
          # reports nothing rather than one that says so. The static job already
          # pays for the same history in the same run.
          fetch-depth: 0
          # Nothing in this job pushes, and it installs and runs the repo's own
          # dependencies in the same workspace the token would sit in.
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # What the gate steps below are handed, read here and nowhere else,
      # because here is the last moment in this job at which no line of the
      # graded repo's own code has run yet — not its install scripts, not its
      # build, not its migrator. A step takes the ones it needs: the search path
      # goes to the step that resolves a program by name.
      #
      # A step writes $GITHUB_ENV and $GITHUB_PATH and the runner folds both
      # into the environment of every LATER step; a step output cannot be
      # rewritten once set. So a migrator that exports DATABASE_URL would
      # otherwise choose which database the gates grade, and one that prepends a
      # directory of its own would decide what `bun` and `docker` mean, and what
      # `curl` and `sha256sum` mean to the ramp's pinned fetch — the gate's own
      # code never executing, or its dumps taken by something that was never the
      # server, or a "verified" k6 of that repo's choosing, and the step green in
      # every case. None of them reaches a value captured before it ran. This is the same bar
      # `_lib/annotations.ts` sets against `::stop-commands::` and
      # `db-replay/database.ts` sets against a migrator's stdout: what the gate
      # grades is not the graded repo's to decide.
      - id: pinned
        run: |
          {
            echo "database-url=$DATABASE_URL"
            echo "bun=$(command -v bun)"
            echo "path=$PATH"
          } >> "$GITHUB_OUTPUT"

      # First of the job's own steps, where the service container it replaces
      # would have been: the server is a fact about this job rather than about
      # any one gate, and every step below connects to it. By full path and SHA
      # rather than `./` for the reason the steps below carry.
      - uses: gokayo43/dev-config-db/.github/actions/db-server@28d44f7374042b20818c921131a07aec1c698a8c
        with:
          database-image: ${{ inputs['database-image'] }}
          database-url: ${{ steps.pinned.outputs['database-url'] }}
          workspace: ${{ github.workspace }}
          bun: ${{ steps.pinned.outputs.bun }}
          path: ${{ steps.pinned.outputs.path }}

      - run: bun install --frozen-lockfile

      # The same step dev-config's database job runs, and for the same reason: a
      # repo whose migrator is generated — a schema compiled out of TypeScript, a
      # lineage a build writes — has nothing for this job to replay until the
      # build has run. Without it such a repo is refused for declaring no
      # migrations, which is a false answer to the question this gate asks.
      - if: inputs.build
        run: bun run build

      # By full path and SHA rather than `./`: inside a called workflow a
      # relative `uses:` resolves against the CALLER's checkout, where this
      # repo's actions are not. The consequence is that the action and the
      # workflow pinning it are two commits — this repo's release contract, in
      # CLAUDE.md under "Releasing an action".
      #
      # The same image the step above started the server from, because the dump
      # client comes out of it: a schema rendered by one build of one product
      # and compared against another's is two renderings, not two schemas. It is
      # one value rather than two statements — the input — and
      # tests/wrapper-inputs.test.ts is what holds every step that takes an
      # image to it.
      - uses: gokayo43/dev-config-db/.github/actions/db-replay@28d44f7374042b20818c921131a07aec1c698a8c
        with:
          database-image: ${{ inputs['database-image'] }}
          database-url: ${{ steps.pinned.outputs['database-url'] }}
          bun: ${{ steps.pinned.outputs.bun }}
          path: ${{ steps.pinned.outputs.path }}

      # After the replay and never before it, and for the same reason the step
      # below is: this is the half of "do these migrations rebuild the schema"
      # that a database nobody deployed cannot answer, and it compares what an
      # upgrade reaches against the schema the replay just built. Its own
      # database, on the same server, dropped whichever way it goes.
      - if: inputs['upgrade-gate']
        uses: gokayo43/dev-config-db/.github/actions/db-upgrade@28d44f7374042b20818c921131a07aec1c698a8c
        with:
          database-image: ${{ inputs['database-image'] }}
          database-url: ${{ steps.pinned.outputs['database-url'] }}
          bun: ${{ steps.pinned.outputs.bun }}
          path: ${{ steps.pinned.outputs.path }}

      # After the replay and never before it: this gate grades the catalogue the
      # migrations produced, so it needs the schema that step builds rather than
      # one written by hand. Its own pin, because an action and the workflow
      # pinning it are two commits — CLAUDE.md, "Releasing an action".
      - uses: gokayo43/dev-config-db/.github/actions/db-datetime@28d44f7374042b20818c921131a07aec1c698a8c
        with:
          datetime-allowlist: ${{ inputs['datetime-allowlist'] }}
          database-url: ${{ steps.pinned.outputs['database-url'] }}
          bun: ${{ steps.pinned.outputs.bun }}

      # Migrations applying says nothing about whether an app can run against
      # what they built, a route table answering says nothing about whether any
      # answer was right, and neither says anything about what the surface does
      # under load. A step of this job rather than a job of its own, for the
      # reason CONTEXT.md gives at "A database job". docs/gates/db-serving.md is
      # the page.
      - uses: gokayo43/dev-config-db/.github/actions/db-serving@28d44f7374042b20818c921131a07aec1c698a8c
        with:
          start-command: ${{ inputs['start-command'] }}
          health-url: ${{ inputs['health-url'] }}
          probe-command: ${{ inputs['probe-command'] }}
          probe-timeout: ${{ inputs['probe-timeout'] }}
          capacity-script: ${{ inputs['capacity-script'] }}
          capacity-path: ${{ inputs['capacity-path'] }}
          route-allowlist: ${{ inputs['route-allowlist'] }}
          bun: ${{ steps.pinned.outputs.bun }}
          path: ${{ steps.pinned.outputs.path }}

      # Everything the steps above wrote into the runner, which is deleted with
      # the runner. The upload belongs to the job rather than to either action:
      # one job builds one database and runs one app against it, an artifact
      # name may be claimed once per run, and two actions publishing under the
      # caller's one name would be the second of them failing on the duplicate.
      #
      # A step that failed on the way to a number is exactly when its partial
      # evidence is worth having — the schema a run never got to compare, the
      # summary of a ramp that died, the output of an app that never answered.
      # Reproducing any of them by re-running with more printing is the shape of
      # debugging every diagnostic here exists to avoid, so the files leave the
      # run whatever happened to it.
      #
      # `always()` and not `!cancelled()`, which is the same sentence with a
      # hole in it: the runner sets the job's status to Cancelled when the JOB
      # is cancelled — and a job that hit its own `timeout-minutes` above is
      # cancelled — so `cancelled()` is true and the step is skipped. That is
      # precisely the run whose evidence is worth most: an app that never came
      # up, or a ramp that wedged, spending the budget and then losing
      # everything it wrote. `always()` is the literal true this needs.
      #
      # server.log is copied while the app still holds it open, which is not a
      # race to fix: the ramp needs the process alive, so there is no moment
      # where the file is finished and the run is not. Read its tail as possibly
      # torn. The boot step's own annotation, not this file, is what says an app
      # failed to start.
      - name: Publish what this job built, measured and read
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # The one place this name is defaulted, so that a caller passing an
          # empty string through is the same as a caller not asking for one.
          name: ${{ inputs['db-gate-evidence'] || 'db-gate-evidence' }}
          path: |
            ${{ runner.temp }}/replay-from-empty.schema
            ${{ runner.temp }}/replay-again.schema
            ${{ runner.temp }}/upgraded-from-base.schema
            ${{ runner.temp }}/server.log
            ${{ runner.temp }}/capacity.json
            ${{ runner.temp }}/route-log-before.json
            ${{ runner.temp }}/route-log-after.json
          # Each of these is written by a step that may not have been reached.
          if-no-files-found: ignore
