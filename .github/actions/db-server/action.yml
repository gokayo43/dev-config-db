name: Database server
description: >-
  Starts the server the rest of the database job grades, from the image the
  consuming repo pinned, waits until it answers a query on the loopback port
  docker assigned it, and answers with the URL it is on. Either server product
  this repo serves is one image reference here — nothing in this step reads a
  product name out of it.
  docs/gates/db-server.md is what it proves and what it cannot catch.

inputs:
  database-image:
    description: >-
      The image to run the server from, pinned by digest. Required, and
      deliberately without a default: the workflow that calls this declares one
      for its consumers, and a second default here would be a second place a
      consumer's choice of server is written down.
    required: true
  database-url:
    description: >-
      The database the gates after this step use, as the calling job declared it
      before running a line of the graded repo's code: the root password the
      image initialises with and the database it creates are read from it, so no
      two steps can disagree about which server was started. It carries no PORT,
      and a URL that does is refused — docker publishes the server on a loopback
      port of its own choosing, which is what keeps two jobs sharing one daemon
      off each other's. The `database-url` output below is this value on that
      port, and it is what every later step connects to.
    required: true
  workspace:
    description: >-
      The workspace this job was given, which is what the container is named
      after: on a self-hosted runner two jobs share a docker daemon, and this
      step reclaims its name before it creates. Passed by the action from
      `github.workspace` rather than read out of the environment, since a step
      of the graded repo can write the variable and not the expression context.
    required: true
  bun:
    description: >-
      The absolute path to the interpreter this step runs under, from the same
      reading. A bare `bun` is resolved through a PATH the graded repo's own
      steps can prepend to, which replaces this step with a program that exits 0.
    required: true
  path:
    description: >-
      The search path this step's own tools are found on, from the same reading
      — `docker`, which starts the server. A digest pins which image runs, and
      nothing in it pins which program is asked to run that image.
    required: true

outputs:
  database-url:
    description: >-
      The server this step started, as the gates after it reach it: the URL the
      calling job declared, on the loopback port docker assigned. A step output
      rather than a $GITHUB_ENV write, because the runner folds one of those
      into every later step and a graded repo's own steps run in between — an
      output cannot be rewritten once set.
    value: ${{ steps.server.outputs['database-url'] }}
  container:
    description: >-
      The container this step created, named after the calling job's workspace.
      Answered whether or not the server came up, because what reads it is the
      job's own removal step — a composite action has no `post:` of its own, so
      a container started here outlives the job unless the job takes it down.
    value: ${{ steps.server.outputs.container }}

runs:
  using: composite
  steps:
    - id: server
      name: Start the server this job grades
      shell: bash
      # The action's own checkout, never the graded repo's. `bun` reads a
      # top-level `preload` out of a `bunfig.toml` in its working directory, so a
      # step running in the graded checkout runs whatever that repo's bunfig
      # names, before a line of this one.
      working-directory: ${{ github.action_path }}
      env:
        INPUT_DATABASE_IMAGE: ${{ inputs['database-image'] }}
        INPUT_WORKSPACE: ${{ inputs.workspace }}
        INPUT_BUN: ${{ inputs.bun }}
        PATH: ${{ inputs.path }}
        # Declared by this step, which is what makes it this step's: the runner
        # overlays a step's own `env:` over the environment it inherited, so a
        # variable of this name written into $GITHUB_ENV earlier does not reach
        # this step.
        DATABASE_URL: ${{ inputs['database-url'] }}
      run: |
        set -euo pipefail
        # shellcheck source=/dev/null
        . "$GITHUB_ACTION_PATH/../_lib/gate.sh"
        gate server.main.ts
