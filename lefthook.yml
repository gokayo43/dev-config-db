# Install/refresh with: bun run prepare
#
# pre-commit stays fast and staged-only; the whole-project checks (typecheck,
# knip, tests) live on pre-push so a green push is a green CI run.

pre-commit:
  parallel: true
  commands:
    format:
      glob: "*.{js,ts,json,md}"
      run: bunx oxfmt --check {staged_files}
    lint:
      glob: "*.{js,ts}"
      # The same flag the `lint` script and CI carry: a directive that no longer
      # suppresses anything is an error there, so it has to be one here too.
      run: bunx oxlint --report-unused-disable-directives-severity=error {staged_files}
    secrets:
      # --staged scans the index, not the working tree: a key that reaches a
      # commit is already burned.
      run: gitleaks git --staged --redact --no-banner .

pre-push:
  parallel: true
  commands:
    typecheck:
      run: bun run typecheck
    test:
      # git hands a hook run from a linked worktree GIT_DIR, and the suite's
      # fixtures run git in directories of their own: inherited, every fixture
      # commit lands on the branch being pushed. Unset here rather than in the
      # suite, because Bun hands a child the environment it started with
      # whatever `process.env` says since. git names the variables itself.
      run: unset $(git rev-parse --local-env-vars) && bun test
